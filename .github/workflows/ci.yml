name: ci

# 门禁在 main、release/** 与所有 PR 上跑；main 与 release/** 的 ruleset 要求这个 check 通过才能合（ADR-0004）
on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # CI 在国外：平台缺省从国内源下载（外层 #277），这里设回官方源（用户自己设了源的，平台不盖）
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_PYTHON_INSTALL_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - name: 门禁（与本地 make check 完全相同）
        run: make check
