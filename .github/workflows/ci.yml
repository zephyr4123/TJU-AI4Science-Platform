name: ci

# 门禁在 main、release/** 与所有 PR 上跑；main 与 release/** 的 ruleset 要求这个 check 通过才能合（ADR-0004）
on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # CI 在国外：平台缺省从国内源下载（外层 #277），这里设回官方源（用户自己设了源的，平台不盖）
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_PYTHON_INSTALL_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - name: 门禁（与本地 make check 完全相同）
        run: make check

  # Windows 上只跑后端测试（外层 #210）：页面构建、make 与 skill 门禁不在 Windows 上做（开发平台用 Mac /
  # Linux），这里证明的是装好的平台在 Windows 上的行为——进程树、编码、路径、Git Bash、install.ps1
  windows:
    runs-on: windows-latest
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_PYTHON_INSTALL_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
    steps:
      # 用 wheel 的人拿到的文件是 LF（在 Linux 上打的包）；runner 缺省的 autocrlf 会把仓库检出成 CRLF
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: pytest
        run: |
          uv sync --locked
          uv run pytest

  # 桌面 App 的外壳（ui/desktop，外层 #282）：门禁就是本地的 make desktop-check（npm run check：准备
  # 图标与 sidecar、fmt、clippy、cargo test 含真起仓里 .venv 的 ai4sci serve）。Mac 与 Windows 两边都跑：
  # 进程树怎么收拾按系统分，一边的 clippy 看不到另一边。不用 paths 过滤：被过滤掉的必过检查会一直停在
  # Pending，PR 合不进去
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_PYTHON_INSTALL_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
    steps:
      - run: git config --global core.autocrlf false   # 与 windows 作业一样按仓里的 LF 检出
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # 外壳的集成测试用仓里 .venv 的 ai4sci；准备构建输入时把 .venv 里的 uv 拷成 sidecar
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/desktop/src-tauri -> target
      - run: npm ci --no-audit --no-fund
        working-directory: ui/desktop
      # 发版那条路（release.yml 的 build-desktop）：照 uv.lock 的版本下 uv、Mac 合成通用包、Windows 在
      # Git Bash 里解 zip。只在发版时才跑的路径在 PR 上先跑一遍
      - name: 像发版那样准备 sidecar
        shell: bash
        run: node ui/desktop/scripts/prepare.mjs --uv-version "$(python .github/scripts/cdn.py uv-version)" --target "${{ matrix.target }}"
      - name: 外壳的门禁（与本地 make desktop-check 相同）
        run: npm run check
        working-directory: ui/desktop
      # check 作业在 Linux 上：Mac 上判「平台还开着」要连进程的环境一起看，这条只有 Mac 跑得到
      - name: 安装脚本（Mac）
        if: runner.os == 'macOS'
        run: uv run pytest tests/test_install_script.py
