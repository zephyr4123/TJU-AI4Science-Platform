name: ci

# 门禁在 main、release/** 与所有 PR 上跑；main 与 release/** 的 ruleset 要求这个 check 通过才能合（ADR-0004）
on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - name: 门禁（与本地 make check 完全相同）
        run: make check
