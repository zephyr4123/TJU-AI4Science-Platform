name: ci

# 门禁在 main、release/** 与所有 PR 上跑；main 与 release/** 的 ruleset 要求这个 check 通过才能合（ADR-0004）
on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # CI 在国外：平台缺省从国内源下载（外层 #277），这里设回官方源（用户自己设了源的，平台不盖）
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_PYTHON_INSTALL_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - name: 门禁（与本地 make check 完全相同）
        run: make check

  # Windows 上只跑后端测试（外层 #210）：页面构建、make 与 skill 门禁不在 Windows 上做（开发平台用 Mac /
  # Linux），这里证明的是装好的平台在 Windows 上的行为——进程树、编码、路径、Git Bash、install.ps1
  windows:
    runs-on: windows-latest
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_PYTHON_INSTALL_MIRROR: https://github.com/astral-sh/python-build-standalone/releases/download
    steps:
      # 用 wheel 的人拿到的文件是 LF（在 Linux 上打的包）；runner 缺省的 autocrlf 会把仓库检出成 CRLF
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: pytest
        run: |
          uv sync --locked
          uv run pytest
