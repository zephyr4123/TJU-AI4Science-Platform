[project]
name = "ai4sci"
# 版本号以 git tag 与 CHANGELOG 为准（make release），这里不维护
version = "0.0.0"
description = "TJU AI for Science 平台：诚实执行的科研框架"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]

[project.scripts]
ai4sci = "framework.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["framework*", "backends*", "compute*", "tools*"]

# schema 与提示模板是框架在运行时要读的文件，不是文档：不随包带走，装出来的 ai4sci
# 会在第一次校验任务包或拼提示时才发现文件不在（读取点：packs.py::_load_schema、
# failures.py::SCHEMA_PATH、prompting.py::TEMPLATE_PATH）。
[tool.setuptools.package-data]
framework = ["schemas/*.json", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["runs", "tasks/*/code", "tasks/*/run_0"]

[tool.ruff.lint]
# BLE：裸 except 与 except Exception 不带 raise 直接报错，这是红线「不吞异常」的机器判据
select = ["E", "F", "W", "B", "I", "BLE", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
