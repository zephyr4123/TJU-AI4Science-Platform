[project]
name = "ai4sci"
# 版本号以 git tag 与 CHANGELOG 为准（make release），这里不维护
version = "0.0.0"
description = "TJU AI for Science 平台：诚实执行的科研框架"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "uv>=0.12",           # 建任务级 venv：找 / 拉解释器、按 lock 同步（contracts/env.py）
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]

[project.scripts]
ai4sci = "framework.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["framework*", "backends*", "compute*", "tools*"]

# schema 与提示模板是框架在运行时要读的文件，不是文档：不随包带走，装出来的 ai4sci
# 会在第一次校验设计那包或拼提示时才发现文件不在。读取点：
#   experiment/pack.py::SCHEMA_DIR（scoring / results / report 三份 schema）
#   capabilities/<能力>/prompt.md（模板跟着能力走，不在 framework 根）
[tool.setuptools.package-data]
"framework.experiment" = ["schemas/*.json"]
"framework.capabilities.design" = ["prompt.md"]
"framework.capabilities.auto_research" = ["prompt.md"]
"framework.capabilities.analysis" = ["prompt.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
# 样例工作区里设计那包的基线代码是执行层写的，各有自己的 venv 与 lint 规则（design 能力 --isolated 跑 ruff）
extend-exclude = ["projects/*/workspaces/*/design/*/code", "projects/*/workspaces/*/design/*/baseline"]

[tool.ruff.lint]
# BLE：裸 except 与 except Exception 不带 raise 直接报错，这是红线「不吞异常」的机器判据
select = ["E", "F", "W", "B", "I", "BLE", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
