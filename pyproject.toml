[project]
name = "ai4sci"
# 版本号以 git tag 与 CHANGELOG 为准（make release）：setuptools-scm 从 tag 读，这里不维护
dynamic = ["version"]
description = "TJU AI for Science 平台：诚实执行的科研框架"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "uv>=0.12",           # 建任务级 venv、起 skill 脚本：框架用 `python -m uv`，装的包里也有
  "ruff>=0.12",         # 设计草稿封 harness 前的 lint（`python -m ruff`，experiment/drafting.py）
]

# 开发时的工具：`uv sync` 缺省装上（PEP 735），装的包里没有。cryptography：发版脚本 cdn.py 照更新器
# 验 minisign 签名（Ed25519，标准库没有），测试要能 import 它（外层 #282）
[dependency-groups]
dev = ["pytest>=8.3", "cryptography>=50"]

[project.scripts]
ai4sci = "framework.cli:main"

[build-system]
requires = ["setuptools>=75", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# 没有 tag 的快照也能出包（版本带 .devN+g<sha>）；正式版本一律从 vX.Y.Z tag 来
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
include = ["framework*", "backends*", "compute*", "procs*"]

# 框架在运行时要读的文件都要随包带走，装出来的 ai4sci 才找得到（外层 #138）：
#   experiment/pack.py::SCHEMA_DIR（scoring / results / report 三份 schema）
#   capabilities/<能力>/*.md（提示模板，多数一份 prompt.md；tests/test_packaging.py 查这里有没有漏）
#   framework/shipped/（make package 拷进来的出厂件：流程库、模板、领域、skill、指南、页面；paths.py 读）
[tool.setuptools.package-data]
"framework" = ["shipped/**/*"]
"backends" = ["catalog/*.json"]
"framework.experiment" = ["schemas/*.json", "harness_contract.md"]
"framework.capabilities.design" = ["prompt.md"]
"framework.capabilities.auto_research" = ["prompt.md"]
"framework.capabilities.analysis" = ["prompt.md"]
"framework.capabilities.reproduction" = ["prompt.md"]
"framework.capabilities.reproducibility" = ["prompt.md"]
"framework.capabilities.literature_search" = ["seed.md", "screen.md"]
"framework.capabilities.literature_read" = ["prompt.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
# 样例工作区里设计那包的基线代码是执行层写的，各有自己的 venv 与 lint 规则（design 能力 --isolated 跑 ruff）
extend-exclude = ["projects/*/workspaces/*/design/*/code", "projects/*/workspaces/*/design/*/baseline", "framework/shipped",
                  # 收录的社区 skill 保持上游原样（纲领 P-22），不按平台的风格改
                  "skills-curated"]

[tool.ruff.lint]
# BLE：裸 except 与 except Exception 不带 raise 直接报错，这是红线「不吞异常」的机器判据
select = ["E", "F", "W", "B", "I", "BLE", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
