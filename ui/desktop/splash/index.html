<!doctype html>
<!-- 启动页（spec desktop.md §1）：外壳自己的本地页，只有它能调外壳的命令。标、名字、一行状态与已用时间、
     进度行；没有能跑的平台时说一句为什么、给「重试」与「打开日志」。不打包：一个 css、一个 js。
     标与 ui/web/public/favicon.svg 是同三条路径（src-tauri/tests/splash.rs 对账）。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AAAI4S</title>
  <link rel="stylesheet" href="splash.css">
  <script type="module" src="splash.js"></script>
</head>
<body>
  <main class="splash">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <path class="a" d="M16.37 21.11L22.84 9.89A10.57 10.57 0 0 1 41.16 9.89L50.86 26.7A7.73 7.73 0 0 1 50.86 34.42L43.45 47.27L31.47 47.27L40.53 31.58A2.03 2.03 0 0 0 40.53 29.54L34 18.23A2.3 2.3 0 0 0 30 18.23L28.34 21.11Z"/>
      <path class="b" d="M25.52 59.4L12.57 59.4A10.57 10.57 0 0 1 3.42 43.54L13.12 26.73A7.73 7.73 0 0 1 19.81 22.87L34.64 22.87L40.63 33.24L22.51 33.24A2.03 2.03 0 0 0 20.75 34.25L14.22 45.57A2.3 2.3 0 0 0 16.21 49.03L19.54 49.03Z"/>
      <path class="c" d="M54.11 32.32L60.58 43.54A10.57 10.57 0 0 1 51.43 59.4L32.02 59.4A7.73 7.73 0 0 1 25.33 55.53L17.91 42.69L23.9 32.32L32.96 48.01A2.03 2.03 0 0 0 34.72 49.03L47.79 49.03A2.3 2.3 0 0 0 49.78 45.57L48.12 42.69Z"/>
    </svg>
    <h1 class="wordmark" aria-label="AAAI4S"><span aria-hidden="true">AAAI</span><span class="accent" aria-hidden="true">4S</span></h1>
    <p class="status" role="status" aria-live="polite"><span id="status">正在打开</span><span id="elapsed" class="elapsed"></span></p>
    <ul id="rows" class="rows" aria-label="进度"></ul>
    <section id="problem" class="problem" hidden>
      <p id="problem-text" class="problem-text" role="alert"></p>
      <div class="actions">
        <button id="retry" type="button" class="primary">重试</button>
        <button id="webview2" type="button" class="primary" hidden>下载 WebView2</button>
        <button id="open-log" type="button">打开日志</button>
      </div>
    </section>
  </main>
</body>
</html>
