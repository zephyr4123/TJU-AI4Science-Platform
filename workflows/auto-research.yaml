# 工作流：自动做实验。任务包已经可以开跑，助理从基线出发一轮一轮改，最后给一份数字能回溯的分析。
name: auto-research
title: 自动做实验
# 前提：任务包已经走完「接一个新课题」，裁判脚本、代码、基线都在
assumes: [harness/, code/, run_0/]
summary: 从基线起一轮一轮改，写分析，机器验证，人验收。
steps:
  - by: 助理
    does: 开一次实验：搬进独立目录，记下起点。
    cap: start
  - by: 助理
    does: 一轮一轮改：过了噪声门槛才留，到上限就停。
    cap: experiment
  - by: 助理
    does: 写分析：结论、数据表、证伪与未决。
    cap: analysis
  - by: 助理
    does: 验证：每个数回溯到结果文件，账本对账。
    cap: verify
  - by: 人
    does: 验收：好了多少、可不可信。
    key: accept
