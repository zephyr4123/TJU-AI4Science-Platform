# 工作流：接一个新课题。研究者把问题说清楚，助理把它变成一个能跑的任务包。
# 一个工作流一个文件；步骤里 cap 是能力清单里的名字，key 是人按的键（publish / accept）。
# 只写 cap 的步骤会被 `ai4sci show flow` 按吃吐文件核对通不通。
name: intake
title: 接一个新课题
summary: 说清课题，发布需求，助理写裁判脚本、跑基线。
steps:
  - by: 人
    does: 说清课题：问题、数据、怎么算好。
  - by: 助理
    does: 起任务包：材料搬进 data/，环境写进 env/。
    cap: init
  - by: 助理
    does: 填需求：问题、指标、预算、设计说明。
  - by: 人
    does: 发布：看一遍，署名。
    key: publish
  - by: 助理
    does: 接任务：写裁判脚本和最朴素的代码。
    cap: design
  - by: 人
    does: 核对：裁判算的是不是你要的数。
  - by: 助理
    does: 跑基线：重复几次，得到起点和抖动。
    cap: baseline
