# 工作流：快速看一眼。基线已经跑完，只想很快看一眼这个方向有没有改进，先不做机器验证。
name: quick-look
title: 快速看一眼
# 前提：任务包已经走完「接一个新课题」，裁判脚本、代码、基线都在
assumes: [harness/, code/, run_0/]
summary: 跑 3 轮，写分析，先不验证。
steps:
  - by: 助理
    does: 开一次实验：搬进独立目录，记下起点。
    cap: start
  - by: 助理
    does: 跑 3 轮：过了噪声门槛才留。
    cap: experiment
    with: {max_iters: 3}
  - by: 助理
    does: 写分析：先不验证。
    cap: analysis
  - by: 人
    does: 看一眼结论，决定这个方向值不值得继续跑下去。
