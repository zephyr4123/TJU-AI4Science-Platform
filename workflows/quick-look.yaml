# 工作流：快速看一眼。基线已经跑完，只想很快看一眼这个方向有没有改进，先不做机器验证。
name: quick-look
title: 快速看一眼
# 前提：任务包已经走完「接一个新课题」，裁判脚本、代码、基线都在
assumes: [harness/, code/, run_0/]
summary: >
  基线跑完之后的一次轻量实验。助理开一次实验，跑 3 轮就停，写一份分析，先不做机器验证。
  适合只想快速判断这个方向值不值得继续深入的场合。
steps:
  - by: 助理
    does: 开一次实验：把任务包搬进一个独立的工作区，记下起点。
    cap: start
  - by: 助理
    does: 跑 3 轮：每轮改一次代码，裁判脚本独立跑分，成绩好过噪声门槛才留下，否则退回。
    cap: experiment
  - by: 助理
    does: 写分析：读账本和每轮的结果，写一份结论、数据表、证伪与未决三节齐全的分析。先不验证。
    cap: analysis
  - by: 人
    does: 看一眼结论，决定这个方向值不值得继续跑下去。
