# 出厂的第二条流程：复现一篇论文（纲领 P-24）。复现不是改进：找齐材料、拿论文自己的代码原样跑一遍、
# 论文值与我们的值并排给人看，人签了写复现性分析、核对数字。没对上再进实验做差距归因——那条分支
# 第一次撞上再拼，这里不预放。
# 文献阶段没有能力：研究助理用自带的搜索找材料、手写 sources.md（材料来源），框架只认文件名。
name: reproduce
title: 论文复现
summary: 找齐材料，原样跑一遍，人核对；复现性分析、数字核对，人验收。
stages:
  - 文献
  - 设计: [reproduction]
  - 断点: 复现结果核对
  - 分析: [reproducibility]
  - 验证
  - 断点: 验收
