# 出厂流程之一：复现一篇论文（纲领 P-24）。没对上再进实验做差距归因——那条分支第一次撞上再拼，这里不预放。
# 文献阶段挂的是两个 skill：这一步推荐用的工具，助理随手调，不开编号产出；材料来源 sources.md 是助理手写的。
name: reproduce
title: 论文复现
summary: 找齐材料，原样跑一遍，人核对；复现性分析、数字核对，人验收。
guide: |-
  什么时候选它：研究者说「这篇论文帮我复现一下」。复现不是改进：找齐材料，拿论文自己的代码原样跑一遍，论文值与我们的值并排给人看，人签了写复现性分析、核对数字。复现的价值有两种：校准（同一套评分脚本跑出论文的数，之后说「比论文好」才可信）与学习。别把复现塞进「从设计到验证」那条，让机器去凑论文的数。

  需求：用 reproduce 模板（`ai4sci show template reproduce`），问清四样：哪篇、哪几个数、复现到第几级、差多少算对上。

  材料你自己找：文献检索那个步骤找的是一个题目下的论文，管不了这一篇的代码、数据、权重。用自带的联网搜索与网页读取去找，然后 `ai4sci output new literature --title 材料来源 --ws <名字>`，在那个目录里写 `sources.md`：找到了什么、选了哪个、为什么、还缺什么，每样东西的链接、commit 或版本、许可证、拿没拿到。该找的：
  - 论文本身：`pdf` 解析，表里的数从 `structured.json` 抄，不凭记忆；
  - 官方代码：论文给的可能只是分析仓，能跑的在别处或别的分支，README 第一段多半会说；
  - 数据、预训练权重：注意版本与划分文件；
  - 别人的复现与已知的坑：仓库 issue 里「跑不出论文的数」那几条；
  - 要什么才能跑：Docker、GPU、API key、账号。key 的名字写进需求，值不进对话、不进文件。
  跑一次要多久、要多少钱、要哪些 key，是你搜完要告诉研究者的头一件事；太贵就提议一个最小子集先跑通。材料散、候选多的，让研究者一起挑。拉代码、数据、权重用 `download`（`ai4sci skill show download`），带 `--ws`，材料才落在那个工作区的 `materials/`；收据里的 commit、sha256 抄进 `sources.md`。

  怎么走：
  1. 设计：`ai4sci cap reproduction --from literature/<n> --code <代码目录名> --compute <机器> --ws <名字> --detach`（`ai4sci show cap reproduction`）。
  2. 断点「复现结果核对」：对没对上你不判。把论文值与我们的值、σ、改了几个上游文件（`upstream.diff`）念给研究者，按需求里的标准由他说，签在页面上。
  3. 分析：`ai4sci cap reproducibility --from design/<n> --from literature/<m> --ws <名字> --detach`。
  4. 验证：`ai4sci cap verify --from analysis/<k> --from design/<n> --ws <名字>`。
  5. 断点「验收」：核对通过之后，研究者在页面上签 `verification/<k>`。

  没对上想缩小差距：一次只换一个设置（种子数、数据版本、预算、硬件），那是实验阶段的事，先跟研究者商量值不值得。
stages:
  - 文献: [pdf, download]
  - 设计: [reproduction]
  - 断点: 复现结果核对
  - 分析: [reproducibility]
  - 验证
  - 断点: 验收
