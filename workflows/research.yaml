# 出厂的那条流：从课题到验证，七个阶段走五个。阶段之间没有显式的输入输出接口，进下一个阶段时助理自己看盘上有什么；
# 「断点」是停下来等人确认——「发布」「验收」是出厂的两个（各有一份确认记录），别的断点写一句要人确认什么。
# 一个阶段不点名能力就是这个阶段用什么由助理看着办；点名可以带参数（名字是 ai4sci show caps 里那颗能力的参数）。
name: research
title: 从课题到验证
summary: 说清课题，人发布；写评分脚本跑基线，人核对；一轮一轮改，写分析初稿，核对数字；人验收。
stages:
  - 假设
  - 断点: 发布
  - 设计
  - 断点: 核对评分脚本算的是不是你要的数
  - 实验: {auto-research: {max_iters: 3}}
  - 分析
  - 验证
  - 断点: 验收
