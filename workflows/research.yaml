# 出厂的那条流程：从设计到验证，七个阶段走四个。需求确认在流程之前（唯一内置的门）。
# 阶段之间没有显式的输入输出接口，进下一个阶段时助理自己看盘上有什么；
# 「断点」是前一个阶段的产出要人签了下游才能读；几个、放哪由流程定，一个不放就是端到端。
# 一个阶段不点名能力就是这个阶段用什么由助理看着办；点名可以带参数（名字是 ai4sci show caps 里那个能力的参数）。
name: research
title: 从设计到验证
summary: 评分脚本与基线，人核对；AutoResearch、分析初稿、数字核对，人验收。
stages:
  - 设计
  - 断点: 评分指标核对
  - 实验: {auto-research: {max_iters: 3}}
  - 分析
  - 验证
  - 断点: 验收
